name: Automatically update Docker image versions

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # to access `--experimental-fetch`
          node-version: '17'

      - name: Run automation script
        id: updt
        run: node --experimental-fetch build-automation.mjs

      - name: Create update PR
        id: cpr
        uses: peter-evans/create-pull-request@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branch: update-branch
          base: main
          commit-message: "Update to ${{ steps.updt.outputs.updated-versions }}"
          title: "Update to ${{ steps.updt.outputs.updated-versions }}"
          delete-branch: true

      - name: Wait for tests to succeed
        uses: lewagon/wait-on-check-action@v1.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-name: build-test
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          wait-interval: 30

      - name: Auto-approve the PR
        uses: juliangruber/approve-pull-request-action@v1
        with:
          github-token: ${{ secrets.PAT }}
          number: ${{ steps.cpr.outputs.pull-request-number }}

      - name: Merge PR
        uses: juliangruber/merge-pull-request-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.cpr.outputs.pull-request-number }}
